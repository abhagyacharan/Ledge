name: Bug
description: Something is broken or behaves wrongly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Where
      options:
        [
          Tasks,
          Expense Tracker,
          Journal,
          Plans,
          Voice,
          Home,
          Settings or sign-in,
          Deploy or backup,
          Other,
        ]
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      multiple: true
      options: [Phone, Installed app (PWA), Desktop browser]
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open Today\n2. Tick a repeating task\n3. ..."
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
