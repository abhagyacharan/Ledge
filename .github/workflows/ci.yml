name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, format, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ledge
          POSTGRES_PASSWORD: ledge
          POSTGRES_DB: ledge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Vitest creates and migrates ledge_test itself (tests/setup/database.ts).
      DATABASE_URL: postgres://ledge:ledge@localhost:5432/ledge
      TEST_DATABASE_URL: postgres://ledge:ledge@localhost:5432/ledge_test
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v7

      # Reads the version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
