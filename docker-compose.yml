# Production-like stack. The `app` service is added in Phase 7.
# The DB port is intentionally NOT published (CLAUDE.md §12). For local development
# use docker-compose.dev.yml, which binds Postgres to 127.0.0.1 only.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ledge}
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - ledge_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ledge_db:
